<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery - Portfolio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=computer,menu,photo_camera,stadia_controller" />
    <link rel="stylesheet" href="style.css">
    <script src="gallery.js" defer></script>
</head>
<body>
    <div id="top-bar">
        <span class="material-symbols-rounded" id="hamburger-icon">menu</span>
        <span id="title">Photo Gallery</span>
    </div>
    <div id="menu-bar">
        <span class="material-symbols-rounded" id="computer-icon">computer</span>
        <span class="material-symbols-rounded" id="controller-icon">stadia_controller</span>
        <span class="material-symbols-rounded" id="camera-icon">photo_camera</span>
    </div>

    <main>
        <div class="category-buttons">
            <button class="category-btn active" data-category="favorites">Favorites</button>
            <button class="category-btn" data-category="for-sale">For Sale</button>
            <button class="category-btn" data-category="wildlife">Wildlife</button>
            <button class="category-btn" data-category="portraits">Portraits</button>
            <button class="category-btn" data-category="landscape">Landscape</button>
            <button class="category-btn" data-category="automotive">Automotive</button>
            <button class="category-btn" data-category="game-boy">Game Boy</button>
            <button class="category-btn" data-category="architecture">Architecture</button>
            <button class="category-btn" data-category="macro">Macro</button>
            <button class="category-btn" data-category="paleontology">Paleontology</button>
        </div>

        <div class="photo-grid">
            <!-- Photos will be dynamically loaded here -->
        </div>

        <button id="load-more" class="load-more-btn" style="display: none;">Load More</button>
    </main>
</body>
</html>
